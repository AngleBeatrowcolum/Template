name: Build and deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITEPRESS_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Cache PDF fonts
        uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: pdf-fonts-${{ hashFiles('scripts/fonts.json') }}
      - run: pnpm setup:fonts
      - name: Install Typst
        run: |
          curl -sL https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - run: pnpm generate
      - run: node --test scripts/tests/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
